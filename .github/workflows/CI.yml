name: CI
on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 11.0.x
  TUNIT_DISABLE_LOGO: 1
  TEST_PROJECT: test/Dns.Net.Tests

defaults:
  run:
    shell: bash

jobs:
  check_format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      # Test jobs build only the test project, without analyzers, so the whole solution is built and analyzed here.
      - name: Build
        run: dotnet build -c Release

      - name: Check .NET format
        run: dotnet format --no-restore -v diag --verify-no-changes

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Build
        run: dotnet build "$TEST_PROJECT" -c Release -p:RunAnalyzers=false

      - name: Test (Release)
        run: dotnet test --project "$TEST_PROJECT" -c Release --no-build --minimum-expected-tests 1

      # The trim analysis would warn of every IsEquivalentTo of TUnit.
      - name: Publish (Native AOT)
        run: dotnet publish "$TEST_PROJECT" -c Release --ucr -p:PublishAot=true -p:RunAnalyzers=false -p:SuppressTrimAnalysisWarnings=true -o artifacts/publish/aot

      - name: Test (Native AOT)
        run: artifacts/publish/aot/Dns.Net.Tests --minimum-expected-tests 1

  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Test (Debug)
        run: dotnet test --project "$TEST_PROJECT" -c Debug -p:RunAnalyzers=false --minimum-expected-tests 1
